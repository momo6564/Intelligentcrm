<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayrab Leads</title>
  <meta name="description" content="Two-sided operations platform for Greek life and collegiate sales.">
  <meta property="og:title" content="Sayrab Leads">
  <meta property="og:description" content="Manage CRM, chapter intelligence, and order operations in one shared workspace.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  {% if landing_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='ops_hub/assets/' ~ landing_css) }}">
  {% endif %}
</head>
<body>
  <div id="root"></div>
  <script>
    window.opsHubLandingLinks = {{ landing_links | tojson }};
    (function () {
      const labelRoutes = {
        login: window.opsHubLandingLinks.login,
        "log in": window.opsHubLandingLinks.login,
        signup: window.opsHubLandingLinks.signup,
        "sign up": window.opsHubLandingLinks.signup,
        "get started": window.opsHubLandingLinks.get_started,
        "start for free": window.opsHubLandingLinks.start_free,
      };

      function normalizeLabel(text) {
        return (text || "").replace(/\s+/g, " ").trim().toLowerCase();
      }

      function resolveLandingTarget(startNode) {
        if (!(startNode instanceof Element)) {
          return null;
        }
        const button = startNode.closest("#root button");
        if (button) {
          const target = labelRoutes[normalizeLabel(button.textContent)];
          if (target) {
            return { node: button, target: target };
          }
        }
        const span = startNode.closest("#root span");
        if (span && normalizeLabel(span.textContent) === "guest order tracking") {
          return { node: span.closest("div") || span, target: window.opsHubLandingLinks.track };
        }
        return null;
      }

      function attachButtonRoutes() {
        document.querySelectorAll("#root button").forEach((button) => {
          const target = labelRoutes[normalizeLabel(button.textContent)];
          if (!target) {
            return;
          }
          button.dataset.opsHubLinked = "1";
          button.dataset.opsHubTarget = target;
          button.style.cursor = "pointer";
        });

        document.querySelectorAll("#root span").forEach((node) => {
          if (normalizeLabel(node.textContent) !== "guest order tracking") {
            return;
          }
          const container = node.closest("div") || node;
          container.dataset.opsHubLinked = "1";
          container.dataset.opsHubTarget = window.opsHubLandingLinks.track;
          container.style.cursor = "pointer";
          container.setAttribute("role", "link");
          if (!container.hasAttribute("tabindex")) {
            container.setAttribute("tabindex", "0");
          }
        });
      }

      document.addEventListener("click", (event) => {
        const match = resolveLandingTarget(event.target);
        if (!match || !match.target) {
          return;
        }
        event.preventDefault();
        window.location.assign(match.target);
      }, true);

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") {
          return;
        }
        const match = resolveLandingTarget(event.target);
        if (!match || !match.target || !(match.node instanceof HTMLElement)) {
          return;
        }
        if (match.node.tagName.toLowerCase() === "button" && event.key === "Enter") {
          return;
        }
        event.preventDefault();
        window.location.assign(match.target);
      }, true);

      const root = document.getElementById("root");
      if (root) {
        const observer = new MutationObserver(attachButtonRoutes);
        observer.observe(root, { childList: true, subtree: true });
      }
      window.addEventListener("load", attachButtonRoutes);
      attachButtonRoutes();
    }());
  </script>
  {% if landing_js %}
  <script type="module" src="{{ url_for('static', filename='ops_hub/assets/' ~ landing_js) }}"></script>
  {% endif %}
</body>
</html>
