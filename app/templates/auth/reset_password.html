<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Greek Chapters CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#edf6ff;
      --line:#bfd6fb;
      --text:#17355f;
      --muted:#5674a5;
      --brand:#2e7dff;
      --brand-strong:#1a66ed;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family:"Manrope","Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(70rem 34rem at -8% -20%, rgba(72,149,255,.34), transparent 45%),
        radial-gradient(65rem 30rem at 112% 12%, rgba(125,193,255,.30), transparent 45%),
        linear-gradient(180deg, #f4f9ff, var(--bg));
      display:grid;
      place-items:center;
      padding:16px;
    }
    .card{
      width:min(520px, 96vw);
      border:1px solid var(--line);
      background:linear-gradient(180deg, #ffffff, #f7fbff);
      border-radius:22px;
      box-shadow:0 22px 44px rgba(32,78,152,.16);
      padding:22px;
      display:grid;
      gap:12px;
    }
    .title{ margin:0; font-size:1.35rem; font-weight:800; letter-spacing:-.01em; }
    .subtitle{ color:var(--muted); font-size:.9rem; }
    .field{ display:grid; gap:5px; font-size:.9rem; font-weight:600; }
    .field input, .field select{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      font:inherit;
      color:#133b6f;
      background:#fff;
    }
    .field input:focus, .field select:focus{
      outline:none;
      border-color:#75aeff;
      box-shadow:0 0 0 3px rgba(46,125,255,.20);
    }
    .btn{
      border:1px solid var(--brand);
      background:linear-gradient(180deg, var(--brand), var(--brand-strong));
      color:#fff;
      font:inherit;
      font-weight:700;
      border-radius:12px;
      padding:10px 12px;
      cursor:pointer;
    }
    .btn:hover{ filter:brightness(1.03); }
    .error{
      border:1px solid #ffc9d5;
      background:#fff2f6;
      color:#b03756;
      border-radius:10px;
      padding:8px 10px;
      font-size:.84rem;
    }
    .success{
      border:1px solid #bfead9;
      background:#edfdf6;
      color:#0f6f59;
      border-radius:10px;
      padding:8px 10px;
      font-size:.84rem;
    }
    a{ color:#165fd6; font-weight:700; text-decoration:none; }
    a:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <form method="post" class="card">
    <h1 class="title">Reset Password</h1>
    <div class="subtitle">Verify your security question to reset your password.</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}<div class="success">{{ success }}</div>{% endif %}
    <label class="field">Username
      <input name="username" autocomplete="username" required>
    </label>
    <label class="field">Security Question
      <select name="security_question" required>
        <option value="">Select a security question</option>
        {% for q in questions %}
          <option value="{{ q }}">{{ q }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">Security Answer
      <input name="security_answer" required>
    </label>
    <label class="field">New Password
      <input name="new_password" type="password" required>
    </label>
    <button type="submit" class="btn">Reset Password</button>
    <div class="subtitle">Remembered it? <a href="/login">Back to login</a></div>
  </form>
</body>
</html>
