<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Greek Chapters CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#edf6ff;
      --line:#bfd6fb;
      --text:#17355f;
      --muted:#5674a5;
      --brand:#2e7dff;
      --brand-strong:#1a66ed;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family:"Manrope","Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(70rem 34rem at -8% -20%, rgba(72,149,255,.34), transparent 45%),
        radial-gradient(65rem 30rem at 112% 12%, rgba(125,193,255,.30), transparent 45%),
        linear-gradient(180deg, #f4f9ff, var(--bg));
      display:grid;
      place-items:center;
      padding:16px;
    }
    .card{
      width:min(460px, 96vw);
      border:1px solid var(--line);
      background:linear-gradient(180deg, #ffffff, #f7fbff);
      border-radius:22px;
      box-shadow:0 22px 44px rgba(32,78,152,.16);
      padding:22px;
      display:grid;
      gap:12px;
    }
    .title{ margin:0; font-size:1.35rem; font-weight:800; letter-spacing:-.01em; }
    .subtitle{ color:var(--muted); font-size:.9rem; }
    .field{ display:grid; gap:5px; font-size:.9rem; font-weight:600; }
    .field input{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      font:inherit;
      color:#133b6f;
      background:#fff;
    }
    .field input:focus{
      outline:none;
      border-color:#75aeff;
      box-shadow:0 0 0 3px rgba(46,125,255,.20);
    }
    .btn{
      border:1px solid var(--brand);
      background:linear-gradient(180deg, var(--brand), var(--brand-strong));
      color:#fff;
      font:inherit;
      font-weight:700;
      border-radius:12px;
      padding:10px 12px;
      cursor:pointer;
    }
    .btn:hover{ filter:brightness(1.03); }
    .error{
      border:1px solid #ffc9d5;
      background:#fff2f6;
      color:#b03756;
      border-radius:10px;
      padding:8px 10px;
      font-size:.84rem;
    }
    .meta{
      border:1px solid var(--line);
      background:#f3f8ff;
      border-radius:12px;
      padding:10px;
      font-size:.82rem;
      color:#486b9f;
      line-height:1.4;
    }
    a{ color:#165fd6; font-weight:700; text-decoration:none; }
    a:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <form method="post" class="card">
    <h1 class="title">Welcome Back</h1>
    <div class="subtitle">Sign in to your light-blue CRM workspace.</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next_path }}">
    <label class="field">Username
      <input name="username" autocomplete="username" required>
    </label>
    <label class="field">Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn">Login</button>
    <div class="subtitle">Need a new workspace? <a href="/signup">Create account</a></div>
    <div class="meta">
      Demo login: <strong>demo / demo123</strong>
    </div>
  </form>
</body>
</html>
